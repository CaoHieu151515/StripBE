<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sTripBe - Swagger UI</title>
    <base href="/swagger-ui/" />
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js"></script>
    <script src="./swagger-ui-standalone-preset.js"></script>
    <script src="./axios.min.js"></script>

    <script type="text/javascript">
      /**
       * 🛠 Lấy token từ localStorage/sessionStorage
       */
      function getBearerToken() {
        let authToken = localStorage.getItem('jhi-authenticationToken') || sessionStorage.getItem('jhi-authenticationToken');
        if (authToken) {
          try {
            return `Bearer ${JSON.parse(authToken)}`;
          } catch (e) {
            return `Bearer ${authToken}`;
          }
        }
        return null;
      }

      /**
       * 🔥 Cập nhật token vào Swagger UI (Authorize Button)
       */
      function updateSwaggerAuth() {
        const token = getBearerToken();
        if (token) {
          console.log('🔑 Gán token vào Swagger UI:', token);
          window.ui.preauthorizeApiKey('Authorization', token);
        } else {
          console.warn('⚠️ Không tìm thấy JWT token, API có thể bị từ chối.');
        }
      }

      /**
       * 🛠 Tạo Axios Config có JWT
       */
      function createAxiosConfig(serverBaseUri) {
        return {
          timeout: 5000,
          baseURL: serverBaseUri,
          headers: { Authorization: getBearerToken() },
        };
      }

      /**
       * 🔥 Luôn chèn JWT vào request API
       */
      function requestInterceptor(req) {
        const token = getBearerToken();
        if (token) {
          req.headers['Authorization'] = token;
          console.log(`📡 Gửi request với token: ${token}`);
        } else {
          console.warn('❌ Không có JWT, request không có Authorization header.');
        }
        return req;
      }

      /**
       * 🛠 Lấy danh sách API Swagger
       */
      async function fetchUrls(serverBaseUri, axiosConfig, baseUrl) {
        let urls;
        try {
          const response = await axios.get('/management/jhiopenapigroups', axiosConfig);
          if (Array.isArray(response.data)) {
            urls = response.data.map(({ group, description }) => ({ name: description, url: `${serverBaseUri}${baseUrl}/${group}` }));
          } else {
            urls = [{ name: 'default', url: `${serverBaseUri}${baseUrl}` }];
          }
        } catch (error) {
          console.error('❌ Lỗi khi tải danh sách Swagger URLs:', error);
          urls = [{ name: 'default', url: `${serverBaseUri}${baseUrl}` }];
        }
        return urls;
      }

      /**
       * 🛠 Khởi tạo Swagger UI với JWT token
       */
      function initializeSwaggerUI(urls, baseUrl) {
        var ui = SwaggerUIBundle({
          urls: urls,
          url: baseUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          filter: true,
          layout: 'StandaloneLayout',
          withCredentials: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          tryItOutEnabled: true,
          requestInterceptor: requestInterceptor, // 🔥 Luôn gán JWT vào request
        });

        window.ui = ui;

        // Gán JWT token ngay khi khởi tạo Swagger UI
        setTimeout(updateSwaggerAuth, 1500);
      }

      /**
       * 🚀 Chạy khi tải trang
       */
      window.onload = async function () {
        const baseUrl = 'v3/api-docs';
        const serverBaseUri = document.baseURI.replace('swagger-ui/', '');
        const axiosConfig = createAxiosConfig(serverBaseUri);
        const urls = await fetchUrls(serverBaseUri, axiosConfig, baseUrl);

        initializeSwaggerUI(urls, baseUrl);
      };

      // 🎯 Lắng nghe thay đổi trong localStorage để cập nhật JWT
      window.addEventListener('storage', event => {
        if (event.key === 'jhi-authenticationToken') {
          console.log('🆕 Token đã thay đổi, cập nhật Swagger UI.');
          updateSwaggerAuth();
        }
      });
    </script>
  </body>
</html>
